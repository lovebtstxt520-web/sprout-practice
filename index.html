<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef3f1">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Sprout</title>
<style>
:root{--bg:#eef3f1;--card:#fff;--ink:#16302b;--mute:#5d746e;--line:#d3e0db;--accent:#0f766e;--accent-ink:#fff;--err:#b4301f;--ok:#15803d;--warn:#b45309}
@media (prefers-color-scheme:dark){:root:not([data-theme]){--bg:#0e1b18;--card:#162824;--ink:#e6f1ee;--mute:#92aaa4;--line:#27403a;--accent:#3fc1b2;--accent-ink:#06201c;--err:#ff8b78;--ok:#4ade80;--warn:#fbbf24}}
[data-theme=light]{--bg:#eef3f1;--card:#fff;--ink:#16302b;--mute:#5d746e;--line:#d3e0db;--accent:#0f766e;--accent-ink:#fff;--err:#b4301f;--ok:#15803d;--warn:#b45309}
[data-theme=dark]{--bg:#0e1b18;--card:#162824;--ink:#e6f1ee;--mute:#92aaa4;--line:#27403a;--accent:#3fc1b2;--accent-ink:#06201c;--err:#ff8b78;--ok:#4ade80;--warn:#fbbf24}
[data-theme=cream]{--bg:#fbf3dc;--card:#fffaf0;--ink:#3a2a10;--mute:#7a6540;--line:#eadcb4;--accent:#8a5a00;--accent-ink:#fff;--err:#b4301f;--ok:#15803d;--warn:#b45309}
[data-theme=olive]{--bg:#eaeddb;--card:#f6f7ec;--ink:#2c3319;--mute:#646b4a;--line:#d3d8b8;--accent:#55672a;--accent-ink:#fff;--err:#b4301f;--ok:#15803d;--warn:#b45309}
[data-theme=rose]{--bg:#f7e9ea;--card:#fff6f6;--ink:#3a1a22;--mute:#86565f;--line:#ecd0d3;--accent:#a8475a;--accent-ink:#fff;--err:#b4301f;--ok:#15803d;--warn:#b45309}
[data-theme=plum]{--bg:#17101f;--card:#211830;--ink:#efe6f7;--mute:#b0a0c2;--line:#35264a;--accent:#c9a3e6;--accent-ink:#1a0f26;--err:#ff8b78;--ok:#4ade80;--warn:#fbbf24}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans Thai","Noto Sans TC",sans-serif;padding-bottom:110px}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:460px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;justify-content:space-between;padding-top:6px}
h1{font-size:22px;margin:0}
.sub{font-size:12px;color:var(--mute);margin:2px 0 0}
.ibtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer}
.ibtn svg{width:19px;height:19px;stroke:var(--ink);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
h2{font-size:15px;margin:18px 0 8px;color:var(--mute)}
ul{list-style:none;margin:0;padding:0}
.plant{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;margin-bottom:10px;cursor:pointer}
.thumb{width:62px;height:62px;border-radius:14px;overflow:hidden;background:color-mix(in srgb,var(--accent) 10%,var(--card));flex:none;display:grid;place-items:center}
.thumb img{width:100%;height:100%;object-fit:cover}
.pmain{flex:1;min-width:0}
.pname{margin:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.psub{margin:1px 0 5px;font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:11px;padding:2px 8px;border-radius:99px;background:color-mix(in srgb,var(--ink) 9%,var(--card));color:var(--mute)}
.chip.good,.chip.safe{background:color-mix(in srgb,var(--ok) 16%,var(--card));color:var(--ok)}
.chip.watch,.chip.unknown{background:color-mix(in srgb,var(--warn) 16%,var(--card));color:var(--warn)}
.chip.bad,.chip.toxic{background:color-mix(in srgb,var(--err) 14%,var(--card));color:var(--err)}
.ring{flex:none;position:relative}
.ring svg{display:block}
.ring .tr{stroke:color-mix(in srgb,var(--ink) 10%,var(--card))}
.ring .pg{stroke:var(--ok);transition:stroke-dashoffset .6s}
.ring.warn .pg{stroke:var(--warn)}.ring.bad .pg{stroke:var(--err)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:inherit}
.empty{text-align:center;padding:30px 10px;color:var(--mute)}
.empty h3{color:var(--ink);margin:10px 0 4px}
.bottom{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 70%,transparent)}
.bottom .in{max-width:460px;margin:0 auto}
.btn{border:0;border-radius:14px;padding:13px 16px;cursor:pointer;font-weight:700;background:var(--accent);color:var(--accent-ink);text-align:center;display:inline-block}
.btn.sec{background:color-mix(in srgb,var(--ink) 9%,var(--card));color:var(--ink);font-weight:600}
.btn.dng{background:color-mix(in srgb,var(--err) 14%,var(--card));color:var(--err)}
.btn.full{width:100%;display:block}
.btn:disabled{opacity:.5}
label.btn input{display:none}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;z-index:40}
.ov.open{display:flex}
.sheet{background:var(--card);width:100%;max-width:460px;border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));max-height:93vh;overflow:auto}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:10px}
.hd h3{margin:0;font-size:17px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fld{margin-bottom:10px}
.qrwrap{text-align:center}
.qrimg{display:inline-block;background:#fff;padding:10px;border-radius:12px;line-height:0}
.qrimg svg{width:180px;height:180px}
.qrurl{font-size:12px;color:var(--mute);margin:6px 0 0;word-break:break-all}
.qrcorner{position:fixed;right:20px;bottom:20px;z-index:50;background:#fff;color:#222;padding:12px 12px 8px;border-radius:16px;box-shadow:0 6px 24px rgba(0,0,0,.18);text-align:center;font-size:13px}
.qrcorner .qrimg{padding:0}
.qrcorner .qrimg svg{width:140px;height:140px}
.qrcorner button{position:absolute;top:2px;right:6px;border:0;background:none;font-size:18px;color:#888;cursor:pointer}
@media (max-width:899px){.qrcorner{display:none}}
.fld label,.lbl{display:block;font-size:12px;color:var(--mute);margin:0 0 3px}
.fld input,.fld select{width:100%;padding:11px;border-radius:12px;border:1px solid var(--line);background:color-mix(in srgb,var(--ink) 5%,var(--card));outline:none}
.fld input:focus,.fld select:focus{border-color:var(--accent)}
.seg{display:flex;gap:6px;margin-bottom:12px}
.seg button{flex:1;padding:10px;border-radius:12px;border:1px solid var(--line);background:none;cursor:pointer;font-weight:600;color:var(--mute)}
.seg button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.acts{display:flex;gap:8px;margin-top:8px}.acts>*{flex:1}
.hero{text-align:center;margin:4px 0 6px}
.say{margin:2px 0 0;color:var(--mute);font-size:14px}
.ringrow{display:flex;align-items:center;gap:14px;background:color-mix(in srgb,var(--accent) 7%,var(--card));border-radius:16px;padding:12px;margin:8px 0}
.ringrow .tx{flex:1}
.ringrow .big{font-size:17px;font-weight:700;margin:0}
.box{border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:8px 0;font-size:14px}
.box h4{margin:0 0 4px;font-size:13px;color:var(--mute)}
.box ul{padding-left:18px;list-style:disc;margin:0}
.preview{width:100%;max-height:180px;object-fit:cover;border-radius:14px;margin-bottom:10px}
.hint{font-size:12px;color:var(--mute);margin:6px 0}
.warnbox{font-size:13px;color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,var(--card));border-radius:10px;padding:8px 10px;margin:8px 0}
.errbox{font-size:13px;color:var(--err);background:color-mix(in srgb,var(--err) 12%,var(--card));border-radius:10px;padding:8px 10px;margin:8px 0}
.hist{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.hist figure{margin:0;flex:none;width:76px;text-align:center}
.hist img{width:76px;height:76px;object-fit:cover;border-radius:12px;display:block;border:3px solid var(--line)}
.hist img.good{border-color:var(--ok)}.hist img.watch{border-color:var(--warn)}.hist img.bad{border-color:var(--err)}
.hist figcaption{font-size:11px;color:var(--mute);margin-top:2px}
.themes{display:flex;flex-wrap:wrap;gap:8px}
.themes button{display:flex;align-items:center;gap:6px;padding:6px 10px 6px 6px;border-radius:99px;border:2px solid var(--line);background:none;cursor:pointer;font-size:13px}
.themes button.on{border-color:var(--accent)}
.themes i{width:20px;height:20px;border-radius:50%;border:1px solid rgba(0,0,0,.2);display:block}
.spin{width:40px;height:40px;border:4px solid var(--accent);border-top-color:transparent;border-radius:50%;animation:sp 1s linear infinite;margin:20px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.splash .drop{animation:fall 1s ease-in}
@keyframes fall{0%{transform:translateY(-14px);opacity:0}30%{opacity:1}100%{transform:translateY(22px);opacity:0}}
.bounce{animation:bn .6s}
@keyframes bn{0%,100%{transform:translateY(0)}40%{transform:translateY(-10px)}}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:13px;z-index:70;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90vw;text-align:center}
.toast.show{opacity:1}
[hidden]{display:none!important}
</style>
</head>

</div>

<div class="bottom"><div class="in"><button class="btn full" id="btnAdd" data-i18n="add"></button></div></div>

<!-- add sheet -->
<div id="sheetAdd" class="ov"><div class="sheet" id="addBody"></div></div>

<div id="sheetDetail" class="ov"><div class="sheet" id="detailBody"></div></div>

  <p class="lbl" style="margin-top:16px" data-i18n="share"></p>

</div></div>
<div id="qrCorner" class="qrcorner" hidden><button id="qrClose" aria-label="close">&times;</button><div id="qrCornerImg" class="qrimg"></div><div data-i18n="scan_try"></div></div>

const $ = id => document.getElementById(id);

const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };

const DAY = 86400000;
const startOfDay = ts => { const d = new Date(ts); d.setHours(0, 0, 0, 0); return d.getTime(); };

let theme = lsGet("pl_theme"); if (!THEMES[theme]) theme = "auto";

function t(k, v) {
  let s = (T[lang] && T[lang][k]) || T.en[k] || k;
  if (v) for (const x in v) s = s.split("{" + x + "}").join(v[x]);

}
function persist() {
  const tryStore = () => lsSet("pl_plants", JSON.stringify(plants));
  if (tryStore()) return true;
  // storage full: keep the first and the 3 newest photos of each plant, then retry
  plants.forEach(p => { if (p.photos.length > 4) p.photos = [p.photos[0]].concat(p.photos.slice(-3)); });
  return tryStore();
}
function toast(msg) { const el = $("toast"); el.textContent = msg; el.classList.add("show"); clearTimeout(toast.tm); toast.tm = setTimeout(() => el.classList.remove("show"), 2500); }

// ===== PLANT LOGIC =====
function daysLeft(p) {
  const due = startOfDay(p.lastWatered) + p.waterEvery * DAY;
  return Math.round((due - startOfDay(Date.now())) / DAY);
}
function moodOf(p) { return p.health === "bad" ? "sick" : daysLeft(p) <= 0 ? "thirsty" : "happy"; }
function waterText(p) { const d = daysLeft(p); return d < 0 ? t("overdue", { n: -d }) : d === 0 ? t("water_today") : t("water_in", { n: d }); }
function stageText(p) { return t("stage_" + (p.stage || "unknown")); }
function subLine(p) { return [p.kind === "batch" && p.count ? "x" + p.count : "", p.species && p.species !== "unknown" ? p.species : "", stageText(p)].filter(Boolean).join(" · "); }
function petText(s) { return t(s === "safe" ? "pet_safe" : s === "toxic" ? "pet_toxic" : "pet_unknown"); }

function charSvg(mood, size) {

    : '<path d="M44 82h12" stroke="#3b2a14" stroke-width="2.4" stroke-linecap="round"/>';

function ringHtml(p, size) {
  const d = daysLeft(p), r = size / 2 - 5, c = 2 * Math.PI * r;
  const frac = Math.max(0, Math.min(1, d / p.waterEvery));
  const cls = d < 0 ? "bad" : d <= 1 ? "warn" : "";
  return '<div class="ring ' + cls + '" style="width:' + size + 'px;height:' + size + 'px;font-size:' + Math.round(size / 3) + 'px">' +
    '<svg width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + " " + size + '" style="transform:rotate(-90deg)">' +
    '<circle class="tr" cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r + '" fill="none" stroke-width="6"/>' +
    '<circle class="pg" cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r + '" fill="none" stroke-width="6" stroke-linecap="round" stroke-dasharray="' + c.toFixed(1) + '" stroke-dashoffset="' + (c * (1 - frac)).toFixed(1) + '"/></svg>' +
    "<b>" + (d < 0 ? "!" : d) + "</b></div>";
}
function petChip(s) { return '<span class="chip ' + esc(s) + '">' + esc(petText(s)) + "</span>"; }

function renderList() {
  const order = plants.slice().sort((a, b) => daysLeft(a) - daysLeft(b));

// ===== PHOTO + AI =====
function processPhoto(file) {
  return new Promise((resolve, reject) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const draw = (max, q) => {
        const r = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = Math.max(1, Math.round(img.width * r)); c.height = Math.max(1, Math.round(img.height * r));
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        return c.toDataURL("image/jpeg", q);
      };
      const out = { full: draw(800, 0.8), thumb: draw(420, 0.65) };
      URL.revokeObjectURL(url); resolve(out);
    };
    img.onerror = () => reject(new Error("image"));
    img.src = url;
  });
}
async function callPlant(payload) {
  const res = await fetch("/api/plant", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
  const j = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(j.error || res.status);
  return j;
}
const b64 = u => u.split(",")[1];

function analysisHtml(r, kind) {

  h += '<p style="margin:4px 0"><span class="lbl" style="display:inline">' + esc(t("species")) + ":</span> <b>" + esc(r.species && r.species !== "unknown" ? r.species : t("unknown_species")) + "</b></p>";

  if (r.lowLight) h += '<div class="warnbox">' + esc(t("low_light")) + "</div>";
  if (r.change) h += '<div class="box"><b>' + esc(t("change_" + r.change)) + "</b>" + (r.changeNote ? "<br>" + esc(r.changeNote) : "") + "</div>";
  if (r.issues && r.issues.length) h += '<div class="box"><h4>' + esc(t("issues")) + "</h4><ul>" + r.issues.map(x => "<li>" + esc(x) + "</li>").join("") + "</ul></div>";
  if (r.advice && r.advice.length) h += '<div class="box"><h4>' + esc(t("advice")) + "</h4><ul>" + r.advice.map(x => "<li>" + esc(x) + "</li>").join("") + "</ul></div>";
  if (r.petNote || r.petSafety !== "unknown") h += '<p class="hint">' + esc(r.petNote) + " " + esc(t("pet_disc")) + "</p>";
  return h + '<p class="hint">' + esc(t("ai_note")) + "</p>";

async function analyzeDraft() {
  const d = draft; d.step = "loading"; d.err = ""; renderAdd();
  try {
    const r = await callPlant({ image: b64(d.photo.full), mode: d.kind, name: d.name, location: d.location, lang });
    if (draft !== d) return;
    d.result = r; d.waterEvery = r.waterEveryDays; d.count = r.count || d.count || 1;
  } catch (e) {
    if (draft !== d) return;
    d.result = null; d.err = String(e.message || e).slice(0, 90);
  }
  d.step = "result"; renderAdd();
}
$("addBody").addEventListener("input", e => {

$("selLang").onchange = e => { lang = e.target.value; lsSet("pl_lang", lang); applyLang(); };
$("themes").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; theme = b.dataset.theme; lsSet("pl_theme", theme); applyTheme(); });
function renderThemes() { $("themes").innerHTML = Object.keys(THEMES).map(k => '<button data-theme="' + k + '" class="' + (k === theme ? "on" : "") + '"><i style="background:' + THEMES[k][1] + '"></i>' + esc(t(THEMES[k][0])) + "</button>").join(""); }
function applyTheme() {
  if (theme === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", theme);
  const m = document.querySelector('meta[name="theme-color"]');
  if (m) m.content = THEME_COLOR[theme] || (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? THEME_COLOR.dark : THEME_COLOR.light);
  renderThemes();
}
function applyLang() {
  document.documentElement.lang = lang === "zh" ? "zh-Hant" : lang;
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
  $("selLang").innerHTML = Object.keys(LANGS).map(k => '<option value="' + k + '"' + (k === lang ? " selected" : "") + ">" + LANGS[k] + "</option>").join("");
  renderThemes(); renderList();
  if (draft) renderAdd();
  if (curId) renderDetail();
}

// ===== SHARE QR =====
function initQr() {
  if (typeof qrcode !== "function") return;
  const url = location.origin + "/";
  const qr = qrcode(0, "M"); qr.addData(url); qr.make();
  const svg = qr.createSvgTag({ cellSize: 4, margin: 0, scalable: true });
  $("qrSet").innerHTML = svg; $("qrUrl").textContent = url;
  $("qrCornerImg").innerHTML = svg;
  let off = false; try { off = sessionStorage.getItem("pl_qr_off") === "1"; } catch (e) {}
  $("qrCorner").hidden = off;
  $("qrClose").onclick = () => { $("qrCorner").hidden = true; try { sessionStorage.setItem("pl_qr_off", "1"); } catch (e) {} };
}

// ===== START =====
applyTheme();
applyLang();
initQr();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
